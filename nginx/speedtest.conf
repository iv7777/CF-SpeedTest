# nginx location block for the VPS+nginx origin alternative to the Worker.
# See README: "Alternative: VPS + nginx origin".
#
# Paste this inside the `server {}` block for the site (adjust the domain,
# secret, and file path to match your setup). Requires nginx built with
# ngx_http_secure_link_module (compiled in by default in most distributions —
# check with: nginx -V 2>&1 | grep -o with-http_secure_link_module).

location = /speedtest/payload.bin {
    secure_link $arg_md5,$arg_expires;
    secure_link_md5 "$secure_link_expires$uri my-shared-secret-here";

    if ($secure_link = "") {
        return 404; # bad/missing signature — 404, not 403, so it doesn't confirm the resource exists
    }
    if ($secure_link = "0") {
        return 404; # expired
    }

    root /usr/share/nginx/html;
}
